<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Talentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --paper: #F6F7FA; --surface: #FFFFFF; --ink: #1E2433; --muted: #5C6478; --line: #DDE1EA;
    --danger: #B42318; --warn: #A15C00; --warn-soft: #FFF3DC;
    --accent: #4B4FC9; --accent-soft: #ECEDFB;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  body[data-group="dreamers"] { --accent: #4B4FC9; --accent-soft: #ECEDFB; }
  body[data-group="builders"] { --accent: #0F7A6C; --accent-soft: #E1F2EF; }
  body[data-group="creators"] { --accent: #B85F06; --accent-soft: #FBEEDD; }
  body.neutral { --accent: #1E2433; --accent-soft: #EEF0F4; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h2.page-title { font: 800 1.8rem/1.1 var(--display); margin: 0; letter-spacing: -.015em; text-transform: none; }
  h3 { font: 600 1.15rem/1.2 var(--display); margin: 0 0 .75rem; }

  .btn { border: 1px solid var(--line); background: var(--surface); padding: .55rem 1rem; border-radius: 10px; font-weight: 600; }
  .btn:hover { border-color: var(--muted); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
  .btn-primary:disabled { opacity: .45; cursor: default; filter: none; }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-danger { color: var(--danger); }
  .btn-sm { padding: .35rem .7rem; font-size: .88rem; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], select, textarea {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: .55rem .75rem; width: 100%;
  }
  textarea { resize: vertical; min-height: 80px; }
  .field { display: block; margin-bottom: 1rem; }
  .field > span { display: block; font-size: .9rem; font-weight: 600; margin-bottom: .3rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .error { color: var(--danger); font-size: .92rem; min-height: 1.4em; }
  .empty { padding: 2rem 1rem; color: var(--muted); text-align: center; }
  .muted { color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }

  /* Login */
  #login, #noAccess { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
  .login-card { width: 100%; max-width: 380px; }
  .login-card h1 { font: 800 2.6rem/1 var(--display); margin: 0 0 .4rem; letter-spacing: -.02em; }
  .login-card p { color: var(--muted); margin: 0 0 1.75rem; }
  .login-card .btn-primary { width: 100%; padding: .75rem; background: #4B4FC9; border-color: #4B4FC9; }
  .login-lang { margin-top: 1.5rem; }

  /* Shell */
  header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1160px; margin: 0 auto; padding: .75rem 1.25rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .brand { font: 800 1.35rem/1 var(--display); letter-spacing: -.01em; margin-right: auto; }
  nav.pages { display: flex; gap: .25rem; background: var(--paper); padding: .25rem; border-radius: 12px; flex-wrap: wrap; }
  nav.pages button { border: 0; background: transparent; padding: .45rem .85rem; border-radius: 9px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  nav.pages button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(30,36,51,.12); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .lang button { border: 0; background: var(--surface); padding: .35rem .6rem; font-weight: 600; font-size: .85rem; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  main { max-width: 1160px; margin: 0 auto; padding: 1.5rem 1.25rem 7rem; }
  .page-head { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .page-head .grow { margin-right: auto; }

  /* Group switcher: the selected group recolors the screen */
  .groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-bottom: 1.75rem; }
  .group-tab { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: .9rem 1rem; transition: border-color .15s, background .15s; }
  .group-tab strong { display: block; font: 800 clamp(1.1rem, 3.2vw, 1.6rem)/1.1 var(--display); letter-spacing: -.01em; color: var(--c); }
  .group-tab small { color: var(--muted); font-size: .88rem; }
  .group-tab[data-g="dreamers"] { --c: #4B4FC9; --s: #ECEDFB; }
  .group-tab[data-g="builders"] { --c: #0F7A6C; --s: #E1F2EF; }
  .group-tab[data-g="creators"] { --c: #B85F06; --s: #FBEEDD; }
  .group-tab[aria-pressed="true"] { border-color: var(--c); background: var(--s); }
  .gdot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; margin-right: .35em; vertical-align: .05em; }
  .gdot.dreamers { background: #4B4FC9; } .gdot.builders { background: #0F7A6C; } .gdot.creators { background: #B85F06; } .gdot.all { background: #8C93A6; }

  /* Attendance */
  .toolbar { display: flex; align-items: end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .toolbar label > span { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: .25rem; }
  .toolbar input[type=date] { width: auto; }
  .count { margin-left: auto; font-size: .95rem; color: var(--muted); }
  .count b { font: 800 1.6rem/1 var(--display); color: var(--accent); margin-right: .2rem; }
  .roster { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  .roster li { display: flex; align-items: center; border-top: 1px solid var(--line); }
  .roster li:first-child { border-top: 0; }
  .mark { flex: 1; display: flex; align-items: center; gap: .9rem; border: 0; background: transparent; padding: .85rem 1rem; text-align: left; font-size: 1.02rem; min-height: 56px; }
  .box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; flex-shrink: 0; transition: background .12s, border-color .12s; }
  .box svg { width: 16px; height: 16px; opacity: 0; }
  .mark[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
  .mark[aria-pressed="true"] .box svg { opacity: 1; }
  .mark[aria-pressed="true"] { font-weight: 600; }
  .remove { border: 0; background: transparent; color: var(--muted); padding: .6rem .9rem; font-size: .85rem; }
  .remove:hover { color: var(--danger); }
  .add-row { display: flex; gap: .5rem; margin-top: 1rem; }
  .add-row input { flex: 1; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: .8rem 1.25rem; }
  .savebar-inner { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; }
  .savebar .status { color: var(--muted); font-size: .92rem; margin-right: auto; }
  .savebar .btn-primary { padding: .7rem 1.6rem; }

  /* Attendance summary */
  .att-mode { max-width: 420px; margin-bottom: 1.25rem; }
  .toolbar select { width: auto; min-width: 12rem; }
  .sum-legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .88rem; color: var(--muted); margin-left: auto; align-self: center; }
  .abs-badge { display: inline-block; min-width: 2rem; text-align: center; font-weight: 700; font-size: .85rem; border-radius: 7px; padding: .1rem .45rem; background: var(--paper); color: var(--ink); }
  .abs-badge.warn { background: #FFE7CC; color: #B45309; }
  .abs-badge.alert { background: #FDE2DF; color: #B42318; }
  tr.warn td { background: #FFF6EC; }
  tr.alert td { background: #FDF0EE; }
  .sum-note { padding: .75rem .9rem; color: var(--muted); font-size: .9rem; border-bottom: 1px solid var(--line); }

  /* English weekly evaluation */
  .eng-tabs { max-width: 700px; margin-bottom: 1.25rem; }
  .hint { font-size: .88rem; margin: -.4rem 0 .75rem; }
  table.ev th, table.ev td { padding: .4rem .45rem; }
  table.ev .stick { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 11rem; text-align: left; font-weight: 600; }
  table.ev thead .stick { background: var(--paper); }
  table.ev .tag { display: block; font-size: .78rem; color: var(--warn); font-weight: 500; }
  table.ev td.up { box-shadow: inset 3px 0 0 #2F8A57; }
  table.ev td.down { box-shadow: inset 3px 0 0 #B42318; }
  select.lv { width: auto; min-width: 8.5rem; padding: .3rem .4rem; font-size: .85rem; border-radius: 8px; border-color: transparent; }
  table.ev textarea.obs { min-width: 16rem; min-height: 2.4rem; padding: .35rem .5rem; font-size: .88rem; }
  .obs-text { min-width: 16rem; font-size: .88rem; }
  .lvb { display: inline-block; font-size: .8rem; font-weight: 600; border-radius: 6px; padding: .1rem .45rem; white-space: nowrap; }
  .lv-por_evaluar { background: #F1F2F5; color: #6B7285; }
  .lv-inicial { background: #EAF4EE; color: #1E2433; }
  .lv-basico, .lv-adecuado { background: #D3EBDC; color: #1E2433; }
  .lv-pre_intermedio { background: #A9D8BA; color: #1E2433; }
  .lv-intermedio, .lv-destacado { background: #4FA474; color: #fff; }
  .lv-avanzado { background: #2A7A4D; color: #fff; }
  .lv-por_mejorar { background: #FFE7CC; color: #B45309; }
  .chgcol { font-weight: 700; text-align: center; }
  .chgcol.up { color: #2A7A4D; } .chgcol.down { color: #B42318; }
  .flag-pill { display: inline-block; font-size: .78rem; font-weight: 600; border-radius: 6px; padding: .05rem .45rem; background: #FFE7CC; color: #B45309; margin: 0 .25rem .2rem 0; white-space: nowrap; }
  @media (max-width: 680px) { .eng-tabs, .att-mode { grid-auto-flow: row; grid-template-columns: 1fr 1fr; } }

  .sub { margin: .3rem 0 0; font-size: .95rem; }
  .pill { border-radius: 999px; padding: .3rem .85rem; font-weight: 600; font-size: .9rem; white-space: nowrap; }
  .pill.ok { background: #D3EBDC; } .pill.pend { background: #FFE7CC; color: #9A4A06; }
  .split { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start; }
  .main-col { flex: 999 1 620px; min-width: 0; }
  .side-col { flex: 1 1 320px; position: sticky; top: 1rem; }
  .ei-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: 1rem; }
  .ei-grid label { font-size: .85rem; font-weight: 600; display: flex; flex-direction: column; gap: .25rem; }
  .ei-grid select.lv { width: 100%; }
  tr.sel-row td, tr.sel-row th { background: #F3F4FF !important; }
  .delta { white-space: nowrap; font-weight: 600; }
  .delta.up { color: #2A7A4D; } .delta.down { color: #B42318; } .delta.none { color: var(--muted); font-weight: 500; } .delta.warn { color: #9A4A06; }
  .tl { border-left: 2px solid var(--line); padding-left: 1rem; display: flex; flex-direction: column; gap: .8rem; }
  .tl .when { font-size: .82rem; font-weight: 600; color: var(--muted); }
  #esTable tbody tr { cursor: pointer; }
  #esTable tbody tr:hover td, #esTable tbody tr:hover th { background: #FBFBFD; }
  .es-detail { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; }
  .es-detail .skills { flex: 999 1 560px; min-width: 0; overflow-x: auto; }
  .es-detail .notes { flex: 1 1 280px; }
  .groups.four { grid-template-columns: repeat(4, 1fr); }
  .group-tab[data-g="all"] { --c: #1E2433; --s: #EEF0F4; }

  .roster li.ghead { padding: .5rem 1rem; background: var(--paper); font-weight: 700; font-size: .88rem; }
  #eiDlg { width: min(560px, calc(100vw - 2rem)); }
  #eiDlg h3 { font: 800 1.35rem/1.15 var(--display); }
  .psy-layout { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start; }
  .psy-kids { flex: 1 1 260px; max-height: 75vh; overflow: auto; position: sticky; top: 1rem; }
  .psy-main { flex: 999 1 520px; min-width: 0; }
  .psy-kids .ghead { padding: .45rem 1rem; font-size: .82rem; font-weight: 700; color: var(--muted); background: var(--paper); border-top: 1px solid var(--line); }
  .kid-btn { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: .6rem 1rem; font-weight: 600; }
  .kid-btn:hover { background: #FBFBFD; }
  .kid-btn[aria-current="true"] { background: #EEF0F4; }
  .kid-btn small { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }
  .kid-head { padding: 1.25rem 1.25rem 1rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; border-bottom: 1px solid var(--line); }
  .kid-stats { display: flex; gap: 1.75rem; margin-top: .75rem; flex-wrap: wrap; }
  .kid-stats b { display: block; font: 800 1.4rem/1.1 var(--display); }
  .kid-stats span { font-size: .82rem; }

  /* Calendar */
  .month-title { text-transform: capitalize; }
  .legend { display: flex; gap: 1rem; font-size: .88rem; color: var(--muted); margin-bottom: .75rem; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: .35rem; }
  .legend .lt { background: var(--accent); } .legend .la { border: 2px solid var(--accent); } .legend .lv { background: #2B3245; } .legend .lg { background: #8C93A6; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--line); gap: 1px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .dow { background: var(--paper); padding: .45rem .5rem; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .day { background: var(--surface); min-height: 112px; padding: .35rem; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
  .day:hover { background: #FBFBFD; }
  .day.out { background: var(--paper); cursor: default; }
  .day .num { font-size: .85rem; font-weight: 600; color: var(--muted); padding: .1rem .25rem; align-self: flex-start; border-radius: 6px; }
  .day.today .num { background: var(--ink); color: #fff; }
  .chip { border: 0; text-align: left; font-size: .78rem; line-height: 1.25; padding: .2rem .4rem; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
  .chip.topic { background: var(--accent); color: #fff; font-weight: 600; }
  .chip.activity { background: var(--surface); border: 1.5px solid var(--accent); color: var(--ink); }
  .chip.volunteer { background: #2B3245; color: #fff; }
  .chip.all.topic { background: #8C93A6; }
  .chip.all.activity { border-color: #8C93A6; }
  .flag { color: var(--warn); font-weight: 700; }
  .chip.topic .flag, .chip.volunteer .flag { color: #FFD58A; }
  .agenda { margin-top: 2rem; }
  .agenda-day { display: grid; grid-template-columns: 5.5rem 1fr; gap: .75rem; padding: .7rem 0; border-top: 1px solid var(--line); }
  .agenda-day .d { font-weight: 600; color: var(--muted); font-size: .92rem; }
  .agenda-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: .15rem 0; }
  .agenda-item .k { font-size: .8rem; font-weight: 600; color: var(--accent); margin-right: .4rem; }
  .agenda-item.all .k { color: #6B7285; }
  .agenda-item .n { display: block; color: var(--muted); font-size: .9rem; }
  .needs-tag { display: inline-block; font-size: .78rem; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: .05rem .4rem; margin-left: .35rem; }

  /* Tables (English summary, admin) */
  .table-wrap { overflow-x: auto; }
  table.t { border-collapse: collapse; width: 100%; font-size: .94rem; }
  table.t th, table.t td { border-bottom: 1px solid var(--line); padding: .55rem .7rem; text-align: left; vertical-align: top; }
  table.t thead th { font-size: .82rem; color: var(--muted); font-weight: 600; background: var(--paper); white-space: nowrap; }
  table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.t tbody tr:last-child td { border-bottom: 0; }
  table.t tfoot td { font-weight: 600; background: var(--paper); border-bottom: 0; }
  .sess-btn { border: 0; background: transparent; text-align: left; padding: 0; color: var(--ink); font-weight: 600; }
  .sess-btn small { display: block; color: var(--muted); font-weight: 400; max-width: 11rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-btn:hover { color: var(--accent); }
  .score { font-weight: 600; }
  .score.low { color: var(--danger); }

  /* Editors */
  .editor { padding: 1.25rem; }
  .editor-roster { margin-top: .5rem; border-top: 1px solid var(--line); }
  .er-row { display: grid; grid-template-columns: minmax(8rem, 1.2fr) 6.5rem 2fr; gap: .6rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid var(--line); }
  .er-row .tag { font-size: .78rem; color: var(--muted); margin-left: .3rem; }
  .er-head { font-size: .82rem; font-weight: 600; color: var(--muted); }
  .editor-actions { display: flex; gap: .5rem; margin-top: 1.25rem; flex-wrap: wrap; }
  .editor-actions .spacer { margin-right: auto; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: .4rem; margin-bottom: 1rem; }
  .seg label { border: 1.5px solid var(--line); border-radius: 10px; padding: .55rem; text-align: center; font-weight: 600; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; align-items: center; gap: .5rem; margin-bottom: .6rem; font-weight: 500; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .participant { border-bottom: 1px solid var(--line); padding: .6rem 0; }
  .participant textarea { margin-top: .4rem; }

  /* Psych */
  .private { display: flex; gap: .6rem; align-items: center; background: #EEF0F4; border-radius: 10px; padding: .6rem .85rem; font-size: .92rem; margin-bottom: 1.25rem; }
  .psy-list .item { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: .8rem 1rem; }
  .psy-list .item:first-child { border-top: 0; }
  .psy-list .item:hover { background: #FBFBFD; }
  .psy-list .meta { font-size: .85rem; color: var(--muted); }
  .record { padding: 1rem 1.1rem; border-top: 1px solid var(--line); }
  .record:first-child { border-top: 0; }
  .record .note { white-space: pre-wrap; margin-top: .3rem; }

  /* Admin */
  .adm-grid { display: grid; gap: 1.5rem; }
  .req { padding: 1rem 1.1rem; border-top: 1px solid var(--line); display: grid; gap: .3rem; }
  .req:first-child { border-top: 0; }
  .req .who { font-weight: 600; }
  .req .actions { display: flex; gap: .5rem; margin-top: .4rem; }
  .status-pill { font-size: .78rem; font-weight: 600; border-radius: 6px; padding: .05rem .45rem; }
  .status-pill.scheduled { background: #E1F2EF; color: #0F7A6C; }
  .status-pill.declined { background: #F4E4E2; color: var(--danger); }
  .status-pill.pending { background: var(--warn-soft); color: var(--warn); }
  details summary { cursor: pointer; color: var(--muted); font-weight: 600; padding: .8rem 1.1rem; }

  /* Dialog */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(500px, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); box-shadow: 0 20px 50px rgba(30,36,51,.25); }
  dialog::backdrop { background: rgba(30,36,51,.35); }
  .dlg { padding: 1.4rem; }
  .dlg h3 { font: 800 1.35rem/1.1 var(--display); margin: 0 0 1rem; }
  .dlg textarea { min-height: 70px; }
  .needs-box { background: var(--paper); border-radius: 10px; padding: .75rem .85rem .35rem; margin-bottom: 1rem; }

  .toast { position: fixed; left: 50%; top: 1rem; transform: translateX(-50%); background: var(--ink); color: #fff; padding: .6rem 1rem; border-radius: 10px; font-size: .92rem; z-index: 10; }
  .toast.err { background: var(--danger); }

  @media (max-width: 680px) {
    .groups { gap: .4rem; }
    .group-tab { padding: .6rem .65rem; border-radius: 12px; }

async function getStudents(group) {
  let q = sb.from('students').select('id, full_name, group_id').eq('active', true);
  if (group) q = q.eq('group_id', group);
  const { data, error } = await q.order('full_name');
  if (error) { toast(t().loadError, true); return null; }
  return data;
}

});
async function loadAttendance() {
  if (state.attMode === 'summary') return loadAttSummary();
  const key = attKey(), date = state.date;
  const st = await getStudents(state.engAll ? null : state.group); if (!st) return;
  let att = [];
  if (st.length) {
    const res = await sb.from('attendance').select('student_id, present').eq('date', date).in('student_id', st.map(s => s.id));
    if (res.error) { toast(t().loadError, true); return; }
    att = res.data;
  }
  if (key !== attKey() || date !== state.date || state.page !== 'att') return;
  state.students = sortForView(st);

}
const checkSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const attKey = () => state.engAll ? 'all' : state.group;
const gIdx = s => GROUPS.findIndex(g => g.id === s.group_id);
const sortForView = list => state.engAll ? [...list].sort((a, b) => gIdx(a) - gIdx(b) || a.full_name.localeCompare(b.full_name, state.lang)) : list;
function renderAttendance() {
  $('newStudentGroup').hidden = !state.engAll;
  let lastG = null;
  $('roster').innerHTML = !state.students.length ? `<li class="empty">${esc(t().noStudents)}</li>` :
    state.students.map(s => {
      const head = state.engAll && s.group_id !== lastG ? `<li class="ghead"><span class="gdot ${s.group_id}"></span>${esc(gName(s.group_id))}</li>` : '';
      lastG = s.group_id;
      return head + `
      <li>
        <button class="mark" data-id="${s.id}" aria-pressed="${!!state.marks[s.id]}"><span class="box">${checkSvg}</span><span>${esc(s.full_name)}</span></button>
        <button class="remove" data-remove="${s.id}">${esc(t().remove)}</button>
      </li>`; }).join('');
  updateCounts();
}
function updateCounts() {
  const n = state.students.length, p = state.students.filter(s => state.marks[s.id]).length;
  $('count').innerHTML = n ? t().count(p, n) : '';
  $('markAll').hidden = !n;
  $('markAll').textContent = n && p === n ? t().clearAll : t().markAll;
  $('saveAtt').disabled = !n || !state.dirty;
  $('saveStatus').textContent = !n ? '' : state.dirty ? t().unsaved : state.hasRecord ? t().recorded : t().notRecorded;
}
$('roster').addEventListener('click', async e => {
  const mark = e.target.closest('.mark');
  if (mark) {

function periodStart(p) {
  const d = new Date();
  if (p === 'month') return ymd(new Date(d.getFullYear(), d.getMonth(), 1));
  if (p === '3m') return ymd(new Date(d.getFullYear(), d.getMonth() - 2, 1));
  return null;
}
async function loadAttSummary() {
  const key = attKey(), period = state.attPeriod;
  const st = await getStudents(state.engAll ? null : state.group); if (!st) return;
  let rows = [];
  if (st.length) {
    const start = periodStart(period);
    for (let from = 0; ; from += 1000) {
      let q = sb.from('attendance').select('student_id, date, present').in('student_id', st.map(s => s.id)).order('date').order('id').range(from, from + 999);
      if (start) q = q.gte('date', start);
      const { data, error } = await q;
      if (error) { toast(t().loadError, true); return; }
      rows = rows.concat(data);
      if (data.length < 1000) break;
    }
  }
  if (key !== attKey() || period !== state.attPeriod || state.page !== 'att' || state.attMode !== 'summary') return;
  state.sum = { students: st, rows };
  renderAttSummary();
}
function renderAttSummary() {
  const { students, rows } = state.sum;
  $('attPeriod').value = state.attPeriod;
  if (!students.length) { $('attSumTable').innerHTML = `<p class="empty">${esc(t().noStudents)}</p>`; return; }
  const days = new Set(rows.map(r => r.date)).size;
  if (!days) { $('attSumTable').innerHTML = `<p class="empty">${esc(t().noAttPeriod)}</p>`; return; }
  const stats = Object.fromEntries(students.map(s => [s.id, { p: 0, a: 0, last: null }]));
  rows.forEach(r => {
    const x = stats[r.student_id]; if (!x) return;
    if (r.present) { x.p++; if (!x.last || r.date > x.last) x.last = r.date; } else x.a++;
  });
  const list = students.map(s => ({ ...s, ...stats[s.id] }))
    .sort((a, b) => b.a - a.a || a.full_name.localeCompare(b.full_name, state.lang));
  const level = a => a > 5 ? 'alert' : a >= 3 ? 'warn' : '';
  const flagged = list.filter(x => level(x.a)).length;
  $('attSumTable').innerHTML = `<div class="sum-note">${esc(t().daysInPeriod(days))}${flagged ? ' · ' + esc(t().flaggedCount(flagged)) : ''}</div>
    <table class="t"><thead><tr><th>${esc(t().student)}</th><th class="num">${esc(t().attended)}</th><th class="num">${esc(t().absences)}</th><th class="num">%</th><th>${esc(t().lastAttended)}</th></tr></thead>
    <tbody>${list.map(x => { const lv = level(x.a), rec = x.p + x.a; return `
      <tr class="${lv}"><td>${nameCell(x)}</td>
        <td class="num">${x.p}</td>
        <td class="num"><span class="abs-badge ${lv}">${x.a}</span></td>
        <td class="num">${rec ? Math.round(100 * x.p / rec) + '%' : '–'}</td>
        <td>${x.last ? esc(fmtShort(x.last)) : '–'}</td></tr>`; }).join('')}</tbody></table>`;
}

function renderCalendar() {
  const y = state.month.getFullYear(), m = state.month.getMonth(), loc = t().locale;
  $('monthTitle').textContent = fmtMonth(state.month);
  const dowFmt = new Intl.DateTimeFormat(loc, { weekday: 'short' });
  const dows = Array.from({ length: 7 }, (_, i) => dowFmt.format(new Date(2024, 0, 1 + i))); // Monday first
  const offset = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const cells = Math.ceil((offset + days) / 7) * 7, todayStr = ymd(new Date());
  const [mFirst, mLast] = monthBounds(state.month), byDate = {}, byStart = {};
  state.entries.forEach(e => {
    const from = e.date < mFirst ? mFirst : e.date, endRaw = e.end_date || e.date, to = endRaw > mLast ? mLast : endRaw;
    (byStart[from] ||= []).push(e);
    for (let d = parseYmd(from); ymd(d) <= to; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) (byDate[ymd(d)] ||= []).push(e);
  });
  let html = dows.map(d => `<div class="dow">${esc(d)}</div>`).join('');
  for (let i = 0; i < cells; i++) {
    const dn = i - offset + 1;
    if (dn < 1 || dn > days) { html += '<div class="day out" aria-hidden="true"></div>'; continue; }
    const ds = ymd(new Date(y, m, dn));
    const chips = (byDate[ds] || []).map(e =>
      `<button class="chip ${e.kind}${e.group_id ? '' : ' all'}" data-entry="${e.id}" title="${esc(e.title)}">${hasNeeds(e) ? '<span class="flag">⚑</span> ' : ''}${esc(e.title)}</button>`).join('');
    html += `<div class="day${ds === todayStr ? ' today' : ''}" data-date="${ds}" role="button" tabindex="0" aria-label="${esc(fmtLong(ds))}"><span class="num">${dn}</span>${chips}</div>`;
  }
  $('grid').innerHTML = html;
  const dates = Object.keys(byStart).sort();
  $('agenda').innerHTML = `<h3>${esc(t().monthAgenda)}</h3>` + (dates.length ? dates.map(ds => `
    <div class="agenda-day"><div class="d">${esc(fmt(ds, { weekday: 'short', day: 'numeric' }))}</div><div>${byStart[ds].map(e => `
      <button class="agenda-item${e.group_id ? '' : ' all'}" data-entry="${e.id}">
        <span class="k">${esc(kindLabel(e.kind))}${e.group_id ? '' : ' · ' + esc(t().allGroups)}${e.end_date ? ' · ' + esc(rangeLabel(e)) : ''}</span>${esc(e.title)}${needsTags(e)}
        ${e.notes ? `<span class="n">${esc(e.notes)}</span>` : ''}
      </button>`).join('')}</div></div>`).join('') : `<p class="empty">${esc(t().emptyMonth)}</p>`);
}
const rangeLabel = e => e.end_date ? `${fmtShort(e.date)} – ${fmtShort(e.end_date)}` : fmtShort(e.date);

  const d = parseYmd(ds || ymd(new Date())), mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7);

/* ----- monthly balance ----- */
function moveMonth(n) {
  if (!confirmDiscard()) return;
  state.dirty = false;
  state.em.month = n === 0 ? monthStart(new Date()) : addMonths(state.em.month, n);
  loadEngMonthly();
}
$('emPrev').addEventListener('click', () => moveMonth(-1));
$('emNext').addEventListener('click', () => moveMonth(1));
$('emThis').addEventListener('click', () => moveMonth(0));

function prevForMonth(list, ms, me) {
  let p = null, init = null;
  for (const e of list) { if (e.kind === 'monthly' && e.period_start < ms) p = e; if (e.kind === 'initial') init = e; }
  if (p) return p;
  return init && init.period_start <= me ? init : null;
}
function deltaInfo(vals, prev) {
  if (allBlank(prev)) return { cls: 'warn', text: t().noBaseline };
  let up = 0, down = 0;
  EF.forEach(f => { const c = chgClass(f, vals[f], prev[f]); if (c === 'up') up++; if (c === 'down') down++; });
  if (!up && !down) return { cls: 'none', text: t().noChange };
  return { cls: up >= down ? 'up' : 'down', text: [up ? `↑ ${t().skillsN(up)}` : '', down ? `↓ ${t().skillsN(down)}` : ''].filter(Boolean).join(' · ') };
}
async function loadEngMonthly() {
  const d = await loadEvalData(); if (!d) return;
  const [ms, me] = monthBounds(state.em.month);
  const att = d.students.length
    ? await fetchAll(() => sb.from('attendance').select('student_id, present').in('student_id', d.students.map(s => s.id)).gte('date', ms).lte('date', me).order('id'))
    : [];
  if (!att) { toast(t().loadError, true); return; }
  if (d.key !== viewKey() || ms !== monthBounds(state.em.month)[0] || !stillHere('monthly')) return;
  const absences = {};
  att.forEach(a => { if (!a.present) absences[a.student_id] = (absences[a.student_id] || 0) + 1; });
  state.en = d; state.em.absences = absences; state.dirty = false;
  renderEngMonthly();
}
function renderEngMonthly() {
  const { students, by } = state.en, [ms, me] = monthBounds(state.em.month);
  $('emTitle').textContent = t().balanceOf(fmtMonth(state.em.month));
  $('emSave').textContent = t().saveBalance(new Intl.DateTimeFormat(t().locale, { month: 'long' }).format(state.em.month));
  if (!students.length) {
    $('emTable').innerHTML = `<p class="empty">${esc(t().noStudents)}</p>`;
    $('emStatus').textContent = ''; $('emSave').disabled = true; return;
  }
  let saved = 0;
  const rows = students.map(s => {
    const list = by[s.id] || [];
    const cur = list.find(e => e.kind === 'monthly' && e.period_start === ms), prev = prevForMonth(list, ms, me);
    if (cur) saved++;
    const base = cur || prev || {}, vals = {};
    EF.forEach(f => { vals[f] = base[f] || 'por_evaluar'; });
    const d = deltaInfo(vals, prev);
    const tags = [isPending(list.find(e => e.kind === 'initial')) ? t().noInitialTag : '',
                  state.em.absences[s.id] ? t().absentDays(state.em.absences[s.id]) : '']
      .filter(Boolean).map(x => `<span class="tag">${esc(x)}</span>`).join('');
    const cells = EF.map(f => { const pv = prev?.[f] || '';
      return `<td class="${chgClass(f, vals[f], pv)}"><select class="lv lv-${vals[f]}" data-f="${f}" data-prev="${pv}" aria-label="${esc(fLabel(f))}, ${esc(s.full_name)}">${levelOpts(f, vals[f])}</select></td>`; }).join('');
    return `<tr data-st="${s.id}" data-group="${s.group_id}"><th scope="row" class="stick">${nameCell(s)}${tags}</th>${cells}
      <td class="delta ${d.cls}">${esc(d.text)}</td>
      <td><textarea class="obs" rows="1" maxlength="1000" placeholder="${esc(prev?.observations || '')}" aria-label="${esc(t().observations)}, ${esc(s.full_name)}">${esc(cur?.observations || '')}</textarea></td></tr>`;
  }).join('');
  $('emTable').innerHTML = `<table class="t ev"><thead><tr><th class="stick">${esc(t().student)}</th>${
    EF.map(f => `<th>${esc(fLabel(f))}</th>`).join('')}<th>${esc(t().monthProgress)}</th><th>${esc(t().observations)}</th></tr></thead><tbody>${rows}</tbody></table>`;
  $('emStatus').textContent = saved ? t().balanceSaved(saved, students.length) : t().balanceNone;
  $('emSave').disabled = false;
}
function updateDelta(tr) {

/* ----- group summary: history from the initial assessment to today ----- */
async function loadEngSummary() {
  const d = await loadEvalData(); if (!d) return;
  if (d.key !== viewKey() || !stillHere('summary')) return;
  state.en = d;
  if (!d.students.some(s => s.id === state.es.sel)) state.es.sel = d.students[0]?.id || null;
  renderEngSummary();
}
function summaryMonths() {
  let min = null, max = null;
  Object.values(state.en.by).flat().forEach(e => {
    if (!min || e.period_start < min) min = e.period_start;
    if (e.kind === 'monthly' && (!max || e.period_start > max)) max = e.period_start;
  });
  let end = monthStart(new Date());
  if (max && parseYmd(max) > end) end = monthStart(parseYmd(max));
  const months = [];
  for (let m = min ? monthStart(parseYmd(min)) : end; m <= end; m = addMonths(m, 1)) months.push(m);
  return months.slice(-12);
}
function studentStory(list, months) {
  const init = list.find(e => e.kind === 'initial');
  const byMonth = months.map(m => list.find(e => e.kind === 'monthly' && e.period_start === ymd(m)) || null);
  const assessed = list.filter(e => e.overall !== 'por_evaluar');
  const first = !isPending(init) ? init : assessed[0], last = assessed[assessed.length - 1];
  let progress = { cls: 'none', text: t().notAssessed };
  if (first && last) {
    if (first === last) progress = { cls: 'none', text: first.kind === 'initial' ? t().onlyInitial : t().noChange };
    else {
      const diff = rank('overall', last.overall) - rank('overall', first.overall);
      progress = diff > 0 ? { cls: 'up', text: `↑ ${t().levelsN(diff)}` } : diff < 0 ? { cls: 'down', text: `↓ ${t().levelsN(-diff)}` } : { cls: 'none', text: t().noChange };
    }
  }
  const flags = [];
  if (isPending(init)) flags.push(t().noInitialTag);
  const lastM = [...list].reverse().find(e => e.kind === 'monthly');
  if (lastM) {
    const cutoff = addMonths(monthStart(parseYmd(lastM.period_start)), -3);
    const older = [...list].reverse().find(e => monthStart(parseYmd(e.period_start)) <= cutoff && !allBlank(e));
    if (older && !EF.some(f => chgClass(f, lastM[f], older[f]) === 'up')) flags.push(t().flagStuck3);
  }
  return { init, byMonth, progress, flags };
}
function renderEngSummary() {
  const { students, by } = state.en, months = summaryMonths();
  const mFmt = new Intl.DateTimeFormat(t().locale, { month: 'short', year: 'numeric' });
  $('esTitle').textContent = t().howProgressed(state.engAll ? t().wholeProgram : gName(state.group));
  if (!students.length) { $('esTable').innerHTML = `<p class="empty">${esc(t().noStudents)}</p>`; $('esDetail').hidden = true; return; }
  const rows = students.map(s => {
    const st = studentStory(by[s.id] || [], months);
    return `<tr data-st="${s.id}" class="${s.id === state.es.sel ? 'sel-row' : ''}"><th scope="row" class="stick">${nameCell(s)}</th>
      <td>${st.init ? badge(st.init.overall) : dash}</td>${st.byMonth.map(e => `<td>${e ? badge(e.overall) : dash}</td>`).join('')}
      <td class="delta ${st.progress.cls}">${esc(st.progress.text)}${st.flags.map(f => `<span class="tag" style="display:block">${esc(f)}</span>`).join('')}</td></tr>`;
  }).join('');
  $('esTable').innerHTML = `<table class="t ev"><thead><tr><th class="stick">${esc(t().student)}</th><th>${esc(t().initialShort)}</th>${
    months.map(m => `<th>${esc(mFmt.format(m))}</th>`).join('')}<th>${esc(t().progress)}</th></tr></thead><tbody>${rows}</tbody></table>`;
  renderEsDetail(months);
}
function renderEsDetail(months) {
  const s = state.en.students.find(x => x.id === state.es.sel);
  if (!s) { $('esDetail').hidden = true; return; }
  const list = state.en.by[s.id] || [], st = studentStory(list, months);
  const mFmt = new Intl.DateTimeFormat(t().locale, { month: 'short', year: 'numeric' });
  const skills = EF.map(f => `<tr><th scope="row" style="font-weight:600">${esc(fLabel(f))}</th><td>${st.init ? badge(st.init[f]) : dash}</td>${
    st.byMonth.map(e => `<td>${e ? badge(e[f]) : dash}</td>`).join('')}</tr>`).join('');
  const notes = [...list].reverse().filter(e => e.observations).map(e => `<div><div class="when">${
    esc(e.kind === 'initial' ? `${t().initialShort} · ${fmtShort(e.period_start)}` : fmtMonth(parseYmd(e.period_start)))}</div><div>${esc(e.observations)}</div></div>`).join('');
  $('esDetail').innerHTML = `<div class="muted" style="font-size:.85rem"><span class="gdot ${s.group_id}"></span>${esc(gName(s.group_id))}</div>
    <h3 style="font:800 1.4rem/1.15 var(--display);margin:.15rem 0 1rem">${esc(s.full_name)}</h3>
    <div class="es-detail">
      <div class="skills"><table class="t ev"><thead><tr><th>${esc(t().skill)}</th><th>${esc(t().initialShort)}</th>${months.map(m => `<th>${esc(mFmt.format(m))}</th>`).join('')}</tr></thead><tbody>${skills}</tbody></table></div>
      <div class="notes"><h3>${esc(t().observations)}</h3><div class="tl">${notes || `<p class="muted" style="margin:0">${esc(t().noObs)}</p>`}</div></div>
    </div>`;
  $('esDetail').hidden = false;
}
$('esTable').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-st]'); if (!tr) return;
  state.es.sel = tr.dataset.st; renderEngSummary();
  $('esDetail').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});

/* ================= PSYCHOLOGY NOTES ================= */
function studentOptions(selected, placeholder) {
  return (placeholder ? `<option value="">${esc(placeholder)}</option>` : '') + GROUPS.map(g => {
    const list = state.psy.students.filter(s => s.group_id === g.id);
    return list.length ? `<optgroup label="${g.name}">${list.map(s => `<option value="${s.id}"${s.id === selected ? ' selected' : ''}>${esc(s.full_name)}</option>`).join('')}</optgroup>` : '';
  }).join('');
}
Object.assign(state.psy, { sel: null, notes: [], q: '' });
async function loadPsych() {
  const st = await getStudents(null); if (!st) return;
  const notes = await fetchAll(() => sb.from('psych_notes').select('id, student_id, note, psych_sessions(id, date, session_type, group_id, focus)').order('id'));
  if (!notes) { toast(t().loadError, true); return; }
  if (state.page !== 'psy') return;
  state.psy.students = st; state.psy.notes = notes.filter(n => n.psych_sessions);
  if (state.psy.sel && !st.some(s => s.id === state.psy.sel)) state.psy.sel = null;
  renderPsyKids(); renderPsyKid();
}
const kidRecords = id => state.psy.notes.filter(n => n.student_id === id)
  .sort((a, b) => b.psych_sessions.date.localeCompare(a.psych_sessions.date));
function renderPsyKids() {
  const q = state.psy.q.trim().toLowerCase(), stats = {};
  state.psy.notes.forEach(n => { const x = stats[n.student_id] ||= { c: 0, last: null }; x.c++; if (!x.last || n.psych_sessions.date > x.last) x.last = n.psych_sessions.date; });
  $('psyKids').innerHTML = GROUPS.map(g => {
    const list = state.psy.students.filter(s => s.group_id === g.id && (!q || s.full_name.toLowerCase().includes(q)));
    if (!list.length) return '';
    return `<div class="ghead"><span class="gdot ${g.id}"></span>${g.name}</div>` + list.map(s => { const x = stats[s.id];
      return `<button class="kid-btn" data-kid="${s.id}" aria-current="${s.id === state.psy.sel}">${esc(s.full_name)}<small>${
        x ? esc(t().sessionsCount(x.c)) + ' · ' + esc(t().lastOn(fmtShort(x.last))) : esc(t().noSessionsYet)}</small></button>`; }).join('');
  }).join('') || `<p class="empty">${esc(t().noMatches)}</p>`;
}
function renderPsyKid() {
  const s = state.psy.students.find(x => x.id === state.psy.sel);
  if (!s) { $('psyKid').innerHTML = `<div class="card"><p class="empty">${esc(t().pickKid)}</p></div>`; return; }
  const recs = kidRecords(s.id), grp = recs.filter(r => r.psych_sessions.session_type === 'group').length;
  const stat = (n, l) => `<div><b>${n}</b><span class="muted">${esc(l)}</span></div>`;
  $('psyKid').innerHTML = `<div class="card">
    <div class="kid-head">
      <div style="margin-right:auto">
        <div class="muted" style="font-size:.85rem"><span class="gdot ${s.group_id}"></span>${esc(gName(s.group_id))}</div>
        <h3 style="font:800 1.6rem/1.15 var(--display);margin:.15rem 0 0">${esc(s.full_name)}</h3>
        <div class="kid-stats">${stat(recs.length, t().sessionsLabel)}${stat(recs.length - grp, t().individualPl)}${stat(grp, t().groupPl)}${stat(recs[0] ? esc(fmtShort(recs[0].psych_sessions.date)) : '–', t().lastSession)}</div>
      </div>
      <button class="btn btn-primary" id="psyNewForKid">${esc(t().newSession)}</button>
    </div>
    <div class="psy-list">${recs.length ? recs.map(r => { const ss = r.psych_sessions; return `
      <div class="record">
        <div style="display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap">
          <strong>${esc(fmtLong(ss.date))}</strong>
          <span class="muted" style="font-size:.88rem">${esc(ss.session_type === 'group' ? t().groupSession + ' · ' + gName(ss.group_id) : t().individual)}${ss.focus ? ' · ' + esc(ss.focus) : ''}</span>
          <button class="btn btn-ghost btn-sm" style="margin-left:auto" data-psy="${ss.id}">${esc(t().editItem)}</button>
        </div>
        <div class="note">${r.note ? esc(r.note) : `<span class="muted">${esc(t().noNote)}</span>`}</div>
      </div>`; }).join('') : `<p class="empty">${esc(t().noRecord)}</p>`}</div>
  </div>`;
}
$('psyKids').addEventListener('click', e => { const b = e.target.closest('[data-kid]'); if (!b) return; state.psy.sel = b.dataset.kid; renderPsyKids(); renderPsyKid(); });
$('psySearch').addEventListener('input', e => { state.psy.q = e.target.value; renderPsyKids(); });
$('psyKid').addEventListener('click', e => {
  if (e.target.closest('#psyNewForKid')) { openPsyEditor(null, state.psy.sel); return; }
  const b = e.target.closest('[data-psy]'); if (b) openPsyEditor(b.dataset.psy);
});
$('psyNewGroup').addEventListener('click', () => openPsyEditor(null, state.psy.sel, 'group'));

async function openPsyEditor(id, kidId = null, forceType = null) {
  let session = null, notes = [];
  if (id) {
    const { data, error } = await sb.from('psych_sessions').select('*, psych_notes(student_id, note)').eq('id', id).single();
    if (error) { toast(t().loadError, true); return; }
    session = data; notes = data.psych_notes;
  }
  state.psy.editing = session; state.psy.editingNotes = notes;
  $('psyEdTitle').textContent = session ? t().editSession : t().newSession;
  $('psyError').textContent = ''; $('psyDelete').hidden = !session;
  $('psyDate').value = session ? session.date : ymd(new Date());
  $('psyFocus').value = session?.focus || '';
  const type = session?.session_type || forceType || 'individual';
  const kid = state.psy.students.find(x => x.id === kidId);
  $('psy-editor').elements.ptype.value = type;
  const indiv = type === 'individual' ? notes[0] : null;
  $('psyStudent').innerHTML = studentOptions(indiv?.student_id || (session ? '' : (kidId || '')), t().chooseStudent);
  $('psyNote').value = indiv?.note || '';
  $('psyGroupSel').innerHTML = GROUPS.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
  $('psyGroupSel').value = session?.group_id || kid?.group_id || state.group;
  renderParticipants(type === 'group' ? (session ? notes : (kid ? [{ student_id: kid.id, note: '' }] : [])) : null);
  syncPsyType();
  $('psy-list').hidden = true; $('psy-editor').hidden = false; state.dirty = false;
}
function syncPsyType() {
  const g = $('psy-editor').elements.ptype.value === 'group';
  $('psyIndividual').hidden = g; $('psyGroup').hidden = !g;
}
function renderParticipants(existing) {
  const prev = {};
  if (existing) existing.forEach(n => { prev[n.student_id] = { on: true, note: n.note }; });
  else $('psyParticipants').querySelectorAll('[data-st]').forEach(p => { prev[p.dataset.st] = { on: p.querySelector('input').checked, note: p.querySelector('textarea').value }; });
  const list = state.psy.students.filter(s => s.group_id === $('psyGroupSel').value);
  $('psyParticipants').innerHTML = list.length ? list.map(s => { const p = prev[s.id] || { on: false, note: '' }; return `
    <div class="participant" data-st="${s.id}">
      <label class="check" style="margin:0"><input type="checkbox"${p.on ? ' checked' : ''}><span>${esc(s.full_name)}</span></label>
      <textarea aria-label="${esc(t().sessionNotes)} ${esc(s.full_name)}"${p.on ? '' : ' hidden'}>${esc(p.note)}</textarea>
    </div>`; }).join('') : `<p class="empty">${esc(t().noStudents)}</p>`;
}
$('psy-editor').addEventListener('change', e => {
  if (e.target.name === 'ptype') syncPsyType();
  if (e.target.id === 'psyGroupSel') renderParticipants(null);
  if (e.target.type === 'checkbox') { const ta = e.target.closest('.participant')?.querySelector('textarea'); if (ta) { ta.hidden = !e.target.checked; if (e.target.checked) ta.focus(); } }
});
$('psy-editor').addEventListener('input', () => { state.dirty = true; });
$('psyCancel').addEventListener('click', () => { if (!confirmDiscard()) return; state.dirty = false; $('psy-editor').hidden = true; $('psy-list').hidden = false; });
$('psy-editor').addEventListener('submit', async e => {
  e.preventDefault(); $('psyError').textContent = '';
  const type = $('psy-editor').elements.ptype.value, date = $('psyDate').value;
  if (!date) return;
  let notes;
  if (type === 'individual') {
    if (!$('psyStudent').value) { $('psyError').textContent = t().pickStudent; return; }
    notes = [{ student_id: $('psyStudent').value, note: $('psyNote').value.trim() }];
  } else {
    notes = [...$('psyParticipants').querySelectorAll('[data-st]')].filter(p => p.querySelector('input').checked)
      .map(p => ({ student_id: p.dataset.st, note: p.querySelector('textarea').value.trim() }));
    if (!notes.length) { $('psyError').textContent = t().pickOne; return; }
  }
  const row = { date, session_type: type, group_id: type === 'group' ? $('psyGroupSel').value : null, focus: $('psyFocus').value.trim() || null, updated_at: new Date().toISOString() };
  const res = state.psy.editing
    ? await sb.from('psych_sessions').update(row).eq('id', state.psy.editing.id).select('id').single()
    : await sb.from('psych_sessions').insert(row).select('id').single();
  if (res.error) { $('psyError').textContent = t().saveError; return; }
  const id = res.data.id;
  const r = await sb.from('psych_notes').upsert(notes.map(n => ({ ...n, session_id: id })), { onConflict: 'session_id,student_id' });
  if (r.error) { $('psyError').textContent = t().saveError; return; }
  const keep = new Set(notes.map(n => n.student_id));
  const drop = state.psy.editingNotes.map(n => n.student_id).filter(s => !keep.has(s));
  if (drop.length) await sb.from('psych_notes').delete().eq('session_id', id).in('student_id', drop);
  if (type === 'individual') state.psy.sel = notes[0].student_id;
  state.dirty = false; toast(t().saved); $('psy-editor').hidden = true; $('psy-list').hidden = false; loadPsych();
});
$('psyDelete').addEventListener('click', async () => {
  if (!state.psy.editing || !confirm(t().deleteConfirm)) return;
  const { error } = await sb.from('psych_sessions').delete().eq('id', state.psy.editing.id);
  if (error) { $('psyError').textContent = t().saveError; return; }
  state.dirty = false; toast(t().deleted); $('psy-editor').hidden = true; $('psy-list').hidden = false; loadPsych();
});

/* ================= ADMIN / OVERVIEW ================= */
$('admPrev').addEventListener('click', () => { state.adm.month = addMonths(state.adm.month, -1); loadAdmin(); });
$('admNext').addEventListener('click', () => { state.adm.month = addMonths(state.adm.month, 1); loadAdmin(); });
async function loadAdmin() {
  const [first, last] = monthBounds(state.adm.month), today = ymd(new Date());
  const [req, needs, att, eng, psy, cal] = await Promise.all([
    sb.from('volunteer_requests').select('*, linked:calendar_entries!volunteer_requests_calendar_entry_id_fkey(id, title, date, group_id)').order('created_at', { ascending: false }).limit(60),
    sb.from('calendar_entries').select('*').gte('date', ymd(addMonths(new Date(), -3))).or('needs_resources.eq.true,needs_volunteer.eq.true').order('date'),
    sb.from('attendance').select('date, present, students!inner(group_id)').gte('date', first).lte('date', last),
    sb.from('english_evaluations').select('group_id').eq('kind', 'monthly').eq('period_start', first),
    sb.from('psych_sessions').select('id').gte('date', first).lte('date', last),
    sb.from('calendar_entries').select('group_id, kind').gte('date', first).lte('date', last),
  ]);
  if (state.page !== 'adm') return;
  if ([req, needs, att, eng, psy, cal].some(r => r.error)) { toast(t().loadError, true); return; }
  state.adm.requests = req.data; state.adm.needs = needs.data.filter(e => (e.end_date || e.date) >= today);
  renderRequests(); renderNeeds();
  // stats
  $('admMonthTitle').textContent = t().monthStats(fmtMonth(state.adm.month));
  const rows = GROUPS.map(g => {
    const a = att.data.filter(x => x.students.group_id === g.id);
    const days = new Set(a.map(x => x.date)).size;
    const rate = a.length ? Math.round(100 * a.filter(x => x.present).length / a.length) + '%' : '–';
    const c = cal.data.filter(x => x.group_id === g.id || x.group_id === null);
    return `<tr><td><span class="gdot ${g.id}"></span>${g.name}</td><td class="num">${days}</td><td class="num">${rate}</td>
      <td class="num">${eng.data.filter(x => x.group_id === g.id).length}</td>
      <td class="num">${c.filter(x => x.kind !== 'volunteer').length}</td><td class="num">${c.filter(x => x.kind === 'volunteer').length}</td></tr>`;
  }).join('');
  $('admStats').innerHTML = `<table class="t"><thead><tr><th>${esc(t().group)}</th><th class="num">${esc(t().daysRecorded)}</th><th class="num">${esc(t().attRate)}</th>
    <th class="num">${esc(t().engSessions)}</th><th class="num">${esc(t().calItems)}</th><th class="num">${esc(t().volSessions)}</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td colspan="6">${esc(t().psyTotal(psy.data.length))}</td></tr></tfoot></table>`;
}
function reqHtml(r, actions) {
  const l = r.linked;
  return `<div class="req">
    <div><span class="who">${esc(r.requester_name)}</span> <span class="status-pill ${r.status}">${esc(t()[r.status])}</span></div>
    ${l ? `<div><span class="muted">${esc(t().forItem)}:</span> <span class="gdot ${l.group_id || 'all'}"></span>${esc(l.title)} · ${esc(fmtShort(l.date))}</div>` : ''}
    ${r.preferred_date ? `<div><span class="muted">${esc(t().preferred)}:</span> ${esc(fmtLong(r.preferred_date))}</div>` : ''}
    ${r.requester_contact ? `<div><span class="muted">${esc(t().contact)}:</span> ${esc(r.requester_contact)}</div>` : ''}
    ${r.message ? `<div>${esc(r.message)}</div>` : ''}
    <div class="muted" style="font-size:.85rem">${esc(t().received)}: ${esc(fmtShort(r.created_at.slice(0, 10)))}</div>
    ${actions ? `<div class="actions"><button class="btn btn-primary btn-sm" data-schedule="${r.id}">${esc(t().schedule)}</button>
      <button class="btn btn-sm" data-decline="${r.id}">${esc(t().decline)}</button></div>` : ''}
  </div>`;
}
function renderRequests() {
  const all = state.adm.requests || [], pending = all.filter(r => r.status === 'pending'), done = all.filter(r => r.status !== 'pending');
  $('admRequests').innerHTML = (pending.length ? pending.map(r => reqHtml(r, true)).join('') : `<p class="empty">${esc(t().noRequests)}</p>`) +
    (done.length ? `<details><summary>${esc(t().earlier)} (${done.length})</summary>${done.map(r => reqHtml(r, false)).join('')}</details>` : '');
}
$('admRequests').addEventListener('click', async e => {
  const s = e.target.closest('[data-schedule]'), d = e.target.closest('[data-decline]');
  if (s) {
    const r = state.adm.requests.find(x => x.id === s.dataset.schedule), l = r.linked;
    openEntry(null, r.preferred_date || l?.date || ymd(new Date()), {
      kind: 'volunteer', title: t().volunteerTitle(r.requester_name), volunteer_name: r.requester_name,
      notes: [l ? l.title : '', r.message || ''].filter(Boolean).join(' — '), group_id: l ? l.group_id : null,
      date: r.preferred_date || l?.date,
    }, r);
  }
  if (d) {
    if (!confirm(t().declineConfirm)) return;
    const { error } = await sb.from('volunteer_requests').update({ status: 'declined', handled_at: new Date().toISOString() }).eq('id', d.dataset.decline);
    if (error) { toast(t().saveError, true); return; }
    loadAdmin();
  }
});
function renderNeeds() {
  const list = state.adm.needs || [];
  $('admNeeds').innerHTML = !list.length ? `<p class="empty">${esc(t().noNeeds)}</p>` :
    `<table class="t"><thead><tr><th>${esc(t().date)}</th><th>${esc(t().item)}</th><th>${esc(t().needs)}</th></tr></thead><tbody>${list.map(e => `
      <tr><td style="white-space:nowrap">${esc(rangeLabel(e))}</td>
        <td><button class="sess-btn" data-need="${e.id}"><span class="gdot ${e.group_id || 'all'}"></span>${esc(e.title)}</button>
          <div class="muted" style="font-size:.85rem">${esc(e.group_id ? gName(e.group_id) : t().allGroups)} · ${esc(kindLabel(e.kind))}</div></td>
        <td>${[e.needs_resources && t().resources, e.needs_volunteer && t().aVolunteer].filter(Boolean).map(esc).join(', ')}
          ${e.needs_note ? `<div class="muted" style="font-size:.88rem">${esc(e.needs_note)}</div>` : ''}</td></tr>`).join('')}</tbody></table>`;
}
$('admNeeds').addEventListener('click', e => {
  const b = e.target.closest('[data-need]'); if (b) openEntry(state.adm.needs.find(x => x.id === b.dataset.need));
});

/* ---------- boot ---------- */
applyLang();
sb.auth.getSession().then(({ data }) => { if (data.session) enter(data.session.user); });
